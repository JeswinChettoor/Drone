services:
  gazebo:
    build: .
    image: nidar-latest
    container_name: nidar-container
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-developer
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OGRE_GL_DISABLE_EXT_DISCARD_FRAMEBUFFER=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/home/developer/.Xauthority:rw
      - .:/workspace:rw
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    network_mode: host
    stdin_open: true
    tty: true
